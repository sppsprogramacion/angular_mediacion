<div class="surface-0 flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
  <div class="grid justify-content-center p-2 lg:p-0 mt-2 login-min-width">
    
    <div class="col-12 mt-5 xl:mt-0 text-center mt-4">
      <img src="assets/imagenes/general/logo-salta-mediacion.png" alt="Image" height="90">
    </div>

    <div class="col-12 md:col-8 lg:col-6 mt-1 login-wrapper">
      <form [formGroup]="formaLogin" autocomplete="off">
        <div class="h-full w-full m-0 py-7 px-4 login-card">
          <div class="text-center mb-5">
            <div class="text-900 text-3xl font-medium mb-3">Bienvenido</div>
            <span class="text-600 font-medium">Login administradores</span>
          </div>

          <div class="w-full md:w-10 mx-auto">
            <div>
              <label for="dni" class="block text-900 text-xl font-medium">Usuario</label>
              <input
                id="dni"
                type="text"
                pInputText
                placeholder="DNI"
                formControlName="dni"
                class="w-full mt-2 login-input-padding"
              />
              <small *ngIf="isValid('dni')" class="p-error">
                <div *ngFor="let validation of user_validation_messages.dni">
                  <div *ngIf="formaLogin.get('dni')?.hasError(validation.type)">
                    {{ validation.message }}
                  </div>
                </div>
              </small>
            </div>

            <div>
              <label for="password" class="block text-900 font-medium text-xl mt-4">Password</label>
              <p-password
                id="password"
                formControlName="password"
                placeholder="Password"
                [toggleMask]="true"
                [feedback]="false"
                styleClass="w-full mt-2 p-input-icon-right p-password-full"
              ></p-password>
              <small *ngIf="isValid('password')" class="p-error">
                <div *ngFor="let validation of user_validation_messages.password">
                  <div *ngIf="formaLogin.get('password')?.hasError(validation.type)">
                    {{ validation.message }}
                  </div>
                </div>
              </small>
            </div>

            <div class="mt-4">
              <button
                pButton
                pRipple
                type="button"
                label="LOGIN"
                class="p-button p-button-success w-full p-3 text-xl mr-2 mb-2"
                (click)="submitFormLogin()"
              ></button>
            </div>
          </div>
        </div>
      </form>
    </div>

  </div>
</div>
